[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyroast"
version = "0.1.0"
description = "A lighthearted Python package that roasts you based on your stats."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Robert Fang" },
  { name = "James Li" },
  { name = "Danial Sagimbayev" },
  { name = "Pranay Engineer" },
  { name = "Daniyal Malik" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/software-students-fall2026/python-package-exercise-team-fast-guys"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
